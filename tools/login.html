<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Přihlášení · DH Post Fabrika</title>
<link rel="icon" type="image/png" href="brand/favicon.png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="theme-color" content="#090909">
<style>
  :root { color-scheme: dark; --red: #b0121a; --red-hot: #e01e26; --line: #2a2a2a; --muted: #9b9b9b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #090909; color: #f4f4f4; font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(900px 480px at 50% -10%, rgba(176, 18, 26, .45), transparent 70%),
      linear-gradient(180deg, rgba(9, 9, 9, .6), #090909 70%), url("brand/praha.webp") center 40% / cover no-repeat, #090909; }
  .box { width: min(400px, 100%); background: rgba(19, 19, 19, .92); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 22px; padding: 30px 26px 24px; box-shadow: 0 30px 80px rgba(0, 0, 0, .7), inset 0 1px 0 rgba(255, 255, 255, .05); text-align: center; }
  .box.tres { animation: tres .4s; }
  @keyframes tres { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  img { width: 76px; height: 76px; border-radius: 50%; box-shadow: 0 0 0 3px #000, 0 0 0 5px var(--red), 0 12px 34px rgba(224, 30, 38, .45); }
  h1 { margin: 16px 0 4px; font: 900 26px/1 "Arial Black", Impact, sans-serif; text-transform: uppercase; letter-spacing: -.01em; }
  h1 span { color: var(--red-hot); }
  p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  form { display: grid; gap: 12px; text-align: left; }
  label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: grid; gap: 6px; }
  input[type=password] { width: 100%; font: 400 16px Inter, system-ui, sans-serif; color: #fff; background: #0d0d0d; border: 1px solid #333; border-radius: 12px; padding: 12px 14px; }
  input[type=password]:focus { outline: none; border-color: var(--red-hot); box-shadow: 0 0 0 3px rgba(224, 30, 38, .25); }
  .check { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 500; color: #ddd; }
  .check input { accent-color: var(--red-hot); width: 16px; height: 16px; }
  button { border: 0; border-radius: 12px; padding: 13px; font: 800 15px/1 Inter, system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #fff; cursor: pointer; background: linear-gradient(180deg, var(--red-hot), var(--red)); }
  button:disabled { filter: grayscale(.5) brightness(.75); cursor: progress; }
  .chyba { min-height: 20px; margin: 0; color: #ff8d92; font-size: 13.5px; text-align: center; }
  small { display: block; margin-top: 16px; color: #6f6f6f; font-size: 12px; }
</style>
</head>
<body>
<main class="box" id="box">
  <img src="brand/dh-avatar.webp" alt="Deník hokeje" width="76" height="76">
  <h1>Post <span>Fabrika</span></h1>
  <p id="popis">Redakční nástroj Deníku hokeje. Pro vstup zadej heslo.</p>
  <form id="form" autocomplete="on">
    <input type="text" name="username" value="denik_hokeje" autocomplete="username" hidden>
    <label>Heslo<input type="password" id="heslo" autocomplete="current-password" required autofocus></label>
    <label class="check"><input type="checkbox" id="pamatovat" checked> Zapamatovat na tomhle zařízení</label>
    <button type="submit" id="tl">Vstoupit</button>
    <p class="chyba" id="chyba" role="alert"></p>
  </form>
  <small>Aplikace je zašifrovaná – bez hesla ji nikdo nespustí ani nepřečte.</small>
</main>
<script>
(() => {
  "use strict";
  const Z = /*__ZAMEK__*/null;
  const KLIC = "dhpf_zamek";
  const $ = (id) => document.getElementById(id);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const doB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

  if (!Z || Z.zamceno) {
    $("popis").textContent = "Aplikace je zamčená. Správce ještě nenastavil heslo (secret APP_HESLO v GitHubu).";
    $("form").hidden = true;
    return;
  }

  async function odvod(heslo) {
    const zaklad = await crypto.subtle.importKey("raw", new TextEncoder().encode(heslo), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(Z.sul), iterations: Z.iterace, hash: "SHA-256" },
      zaklad, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }

  async function otevri(klic) {
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(Z.iv) }, klic, b64(Z.data)));
    window.__dhZamceno = true;
    document.open();
    document.write(html);
    document.close();
  }

  // Zapamatovaný klíč (jen na tomhle zařízení)
  (async () => {
    let ulozeny = null;
    try { ulozeny = JSON.parse(localStorage.getItem(KLIC) || "null"); } catch { /* nic */ }
    if (ulozeny?.sul === Z.sul && ulozeny.klic) {
      try {
        const klic = await crypto.subtle.importKey("raw", b64(ulozeny.klic), "AES-GCM", true, ["decrypt"]);
        await otevri(klic);
        return;
      } catch { try { localStorage.removeItem(KLIC); } catch { /* nic */ } }
    }
  })();

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const tl = $("tl");
    tl.disabled = true; tl.textContent = "Ověřuju…"; $("chyba").textContent = "";
    try {
      const klic = await odvod($("heslo").value);
      try {
        await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(Z.iv) }, klic, b64(Z.data));
      } catch {
        $("chyba").textContent = "Špatné heslo.";
        $("box").classList.remove("tres"); void $("box").offsetWidth; $("box").classList.add("tres");
        $("heslo").select();
        return;
      }
      if ($("pamatovat").checked) {
        try { localStorage.setItem(KLIC, JSON.stringify({ sul: Z.sul, klic: doB64(await crypto.subtle.exportKey("raw", klic)) })); } catch { /* nic */ }
      }
      await otevri(klic);
    } catch (err) {
      $("chyba").textContent = "Přihlášení se nepovedlo: " + err.message;
    } finally {
      if (tl.isConnected) { tl.disabled = false; tl.textContent = "Vstoupit"; }
    }
  });
})();
</script>
</body>
</html>
