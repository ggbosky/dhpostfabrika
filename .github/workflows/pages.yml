name: Zveřejnit web na GitHub Pages

on:
  push:
    branches: [claude/intelligent-lovelace-qzitaa, main]
    paths: ["web/**", "tools/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Aplikace se zašifruje heslem ze secretu APP_HESLO – na webu je pak jen přihlašovací stránka.
      - name: Zamknout aplikaci heslem
        env:
          APP_HESLO: ${{ secrets.APP_HESLO }}
        run: |
          pip install --quiet cryptography
          python3 tools/zamkni.py web _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
